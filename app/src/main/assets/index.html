    <script>
        let pastResults = [];
        let lastProcessedBlock = "";

        // WinGo 1 Min ka exact period generator jo game ke sath sync rahega
        function getExactGamePeriod() {
            let now = new Date();
            let year = now.getFullYear();
            let month = String(now.getMonth() + 1).padStart(2, '0');
            let day = String(now.getDate()).padStart(2, '0');
            
            let hours = now.getHours();
            let minutes = now.getMinutes();
            
            // Din ki shuruat (00:00) se ab tak ke total minutes
            let totalMinutesToday = (hours * 60) + minutes;
            
            // Screenshot ke format ke mutabiq YYYYMMDD + 1000 + 5-digit sequence
            let sequenceVal = 10000 + totalMinutesToday;
            let sequenceNumber = String(sequenceVal).padStart(5, '0');

            return `${year}${month}${day}1000${sequenceNumber}`;
        }

        // Strict Official Rules (Number to Color & Size mapping)
        function getAttributes(num) {
            let size = num >= 5 ? "Big" : "Small";
            let color = "";
            
            if (num === 0) {
                color = "Red/Violet";
            } else if (num === 5) {
                color = "Green/Violet";
            } else if (num === 1 || num === 3 || num === 7 || num === 9) {
                color = "Green";
            } else {
                color = "Red";
            }
            return { color, size, num };
        }

        function engineSync() {
            let now = new Date();
            let seconds = now.getSeconds();
            
            // 60-second countdown jo har minute ke end par zero ho
            let secondsLeft = 60 - seconds;
            if (secondsLeft === 60) secondsLeft = 0;
            
            let currentPeriod = getExactGamePeriod();

            // Timer display update
            document.getElementById('timer').innerText = `00:${secondsLeft < 10 ? '0' + secondsLeft : secondsLeft}`;
            document.getElementById('periodText').innerText = `Period ID: ${currentPeriod}`;

            if (lastProcessedBlock !== currentPeriod) {
                if (lastProcessedBlock !== "") {
                    pushToHistory(lastProcessedBlock);
                }
                lastProcessedBlock = currentPeriod;
                runAIAlgorithm();
            }
        }

        function runAIAlgorithm() {
            let randomNum = Math.floor(Math.random() * 10);
            let attr = getAttributes(randomNum);
            document.getElementById('predictionDisplay').innerHTML = `${attr.color} / ${attr.size} (${attr.num})`;
        }

        function pushToHistory(periodCode) {
            let randomNum = Math.floor(Math.random() * 10);
            let attr = getAttributes(randomNum);

            pastResults.unshift({ period: periodCode, ...attr });
            if (pastResults.length > 8) pastResults.pop();

            let historyBox = document.getElementById('historyBox');
            historyBox.innerHTML = '';

            pastResults.forEach(item => {
                let colorCode = item.color.includes('Green') ? '#4ade80' : (item.color.includes('Red') ? '#f87171' : '#c084fc');
                let div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<span>#${item.period}</span> <span style="color: ${colorCode}; font-weight:bold;">${item.color} (${item.num})</span>`;
                historyBox.appendChild(div);
            });
        }

        runAIAlgorithm();
        setInterval(engineSync, 1000);
        engineSync();
    </script>
